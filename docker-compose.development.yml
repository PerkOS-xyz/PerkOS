# PerkOS App Development — isolated deployment for dev.perkos.xyz.
# Run with:
#   docker compose --env-file .env.development \
#     -p perkos-app-dev -f docker-compose.development.yml up -d --build

services:
  app-dev:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?required}
        NEXT_PUBLIC_PERKOS_CHAT_URL: ${NEXT_PUBLIC_PERKOS_CHAT_URL:-}
        NEXT_PUBLIC_PERKOS_PAY_URL: ${NEXT_PUBLIC_PERKOS_PAY_URL:?required}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?required}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?required}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?required}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:?required}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:?required}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?required}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_RECEIPT_ANCHOR_ADDRESS: ${NEXT_PUBLIC_RECEIPT_ANCHOR_ADDRESS:-}
        NEXT_PUBLIC_RECEIPT_ANCHOR_CHAIN_ID: ${NEXT_PUBLIC_RECEIPT_ANCHOR_CHAIN_ID:-}
        NEXT_PUBLIC_ALCHEMY_API_KEY: ${NEXT_PUBLIC_ALCHEMY_API_KEY:-}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID:-}
        NEXT_PUBLIC_PRIVY_CLIENT_ID: ${NEXT_PUBLIC_PRIVY_CLIENT_ID:-}
        PERKOS_ENVIRONMENT: development
    container_name: perkos-app-dev
    restart: unless-stopped
    networks:
      - perkos-knowledge_default
    environment:
      PERKOS_ENVIRONMENT: development
      PERKOS_API_URL: https://dev.api.perkos.xyz
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?required}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:?required}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      PERKOS_WHITELIST: ${PERKOS_WHITELIST:-}
      PERKOS_LLM_GATEWAY_URL: ${PERKOS_LLM_GATEWAY_URL:-https://api.llm.perkos.xyz}
      PERKOS_LLM_ADMIN_TOKEN: ${PERKOS_LLM_ADMIN_TOKEN:-}
      RESEND_API: ${RESEND_API:-}
      EMAIL_FROM: ${EMAIL_FROM:-PerkOS Dev <noreply@perkos.xyz>}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  perkos-knowledge_default:
    external: true
