name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Public Firebase config is safe in CI logs.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-stub
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.example.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: perkos-ci
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: perkos-ci.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1:web:ci"
      NEXT_PUBLIC_PERKOS_CHAT_URL: wss://chat.perkos.xyz/chat
      PERKOS_WHITELIST: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build (production)
        run: npm run build
